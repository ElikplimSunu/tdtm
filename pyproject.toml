[project]
name = "tdtm"
dynamic = ["version"]
description = "Microsoft TMT-style automatic threat generation for OWASP Threat Dragon models"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Eric Sunu" }]
keywords = ["threat-modeling", "stride", "threat-dragon", "tmt", "security"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ElikplimSunu/tdtm"
Issues = "https://github.com/ElikplimSunu/tdtm/issues"

[project.optional-dependencies]
pytm = ["pytm>=1.4"]

[project.scripts]
tdtm = "tdtm.cli:main"

[dependency-groups]
dev = ["pytest>=8", "jsonschema>=4", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/tdtm/__init__.py"  # the one version for tdtm and ThreatSketch; scripts/bump.py sets it

[tool.hatch.build.targets.sdist]
include = ["/src/tdtm", "/tests", "/examples", "/README.md", "/CHANGELOG.md", "/LICENSE", "/THIRD_PARTY_NOTICES.md"]
exclude = ["/tests/fixtures/private"]

[tool.hatch.build.targets.wheel]
packages = ["src/tdtm"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
