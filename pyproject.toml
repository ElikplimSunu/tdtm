[project]
name = "tdtm"
version = "0.1.0"
description = "Microsoft TMT-style automatic threat generation for OWASP Threat Dragon models"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Eric Sunu" }]
dependencies = []

[project.optional-dependencies]
pytm = ["pytm>=1.4"]

[project.scripts]
tdtm = "tdtm.cli:main"

[dependency-groups]
dev = ["pytest>=8", "jsonschema>=4", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tdtm"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
